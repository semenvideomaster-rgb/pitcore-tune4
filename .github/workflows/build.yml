name: Build NEVE 1081 VST3
on:
  workflow_dispatch:
  push:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -A x64
      - name: Build
        run: cmake --build build --config Release --target N1081_VST3 --parallel
      - name: Zip VST3
        shell: pwsh
        run: Compress-Archive -Path "build/N1081_artefacts/Release/VST3/*" -DestinationPath "$env:RUNNER_TEMP/NEVE1081_VST3.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: NEVE1081-VST3
          path: build/N1081_artefacts/Release/VST3/
      - name: Publish to vst-neve-out branch
        shell: bash
        run: |
          cp "$RUNNER_TEMP/NEVE1081_VST3.zip" /tmp/NEVE1081_VST3.zip
          git config user.name build-bot
          git config user.email build-bot@users.noreply.github.com
          git checkout --orphan vst-neve-out
          git rm -rf . >/dev/null 2>&1 || true
          cp /tmp/NEVE1081_VST3.zip ./NEVE1081_VST3.zip
          git add NEVE1081_VST3.zip
          git commit -m "VST3 build"
          git push -f origin vst-neve-out
