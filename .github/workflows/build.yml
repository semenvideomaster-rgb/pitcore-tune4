name: Build APK

on:
  push:
    branches: [ virtual-mixer ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk VirtualMixer.apk

      - uses: actions/upload-artifact@v4
        with:
          name: VirtualMixer-apk
          path: VirtualMixer.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: virtual-mixer-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Virtual Mixer (сборка ${{ github.run_number }})
          body: Скачайте VirtualMixer.apk на телефон и установите.
          files: VirtualMixer.apk
          make_latest: false
