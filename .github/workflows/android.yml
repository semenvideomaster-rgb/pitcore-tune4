name: Build Android APK
on:
  workflow_dispatch:
  push:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ScratchStudio-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Publish APK to apk-out branch
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/ScratchStudio.apk
          git config user.name "build-bot"
          git config user.email "build-bot@users.noreply.github.com"
          git checkout --orphan apk-out
          git rm -rf . >/dev/null 2>&1 || true
          cp /tmp/ScratchStudio.apk ./ScratchStudio.apk
          git add ScratchStudio.apk
          git commit -m "APK build"
          git push -f origin apk-out
